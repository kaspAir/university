# Local development: PostgreSQL 16 only. The API runs from the virtualenv (see README).
name: campus

services:
  db:
    image: postgres:16
    container_name: campus-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    # Temporal dev server (in-memory, UI on 8233). Production needs a persistent Temporal deployment (ADR-0008).
    image: temporalio/temporal:latest
    container_name: campus-temporal
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"

volumes:
  db_data:
