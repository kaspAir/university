[alembic]
script_location = migrations
path_separator = os
prepend_sys_path = packages/domain;packages/contracts;packages/infrastructure;services/llm_gateway;workers/research;apps/api
# The URL comes from CAMPUS_MIGRATION_DATABASE_URL (owner role), see migrations/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
